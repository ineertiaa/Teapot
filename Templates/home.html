<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Home</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='homestyle.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='fonts.css') }}">

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    </head>
    <body>
        <div class="tasks">
            {% if tasks %}
                {% for task in tasks %}
                    <div class="task">
                        <h2>{{ task[1] }}</h2>
                        <p>{{ task[2] }}</p>
                        <p>Assigned to: {{ task[3] }}</p>
                        <p>Made by: {{ task[4] }}</p>
                        <p>Status: {{ task[5] }}</p>
                        <p>Priority: {{ task[6] }}</p>
                        <p>Due: {{ task[7] }}</p>
                        <br>
                        <img src="{{ url_for('static', filename='img/trash.webp') }}" style="width: 30px; height: auto;" data-id="{{ task[0] }}" onclick="del_task(this.dataset.id)">
                        <br>
                    </div>
                {% endfor %}
            {% endif %}
        </div>

        <div style="display: flex; align-items: center; justify-content: center; padding-top: 30px;">
            <button style="font-size: 50px; border-radius: 5px; border-style: none; margin: 0 auto;"><i class="fa-solid fa-plus" onclick="openclose_modal(true)"></i></button>
        </div>

        <!-- TODO: Make task making modal-->

        <form class="task_modal">
            <h1>Make new task</h1>
            
            <br>

            <input type="text" name="title" placeholder="Title">
            <input type="text" name="description" placeholder="Description">

            <input type="text" name="assigned_to" placeholder="Assign to (username)">
            <input type="text" name="priority" placeholder="Priority">

            <input type="date" name="due_date" placeholder="Due Date">

            <br>

            <button type="submit">Ok!</button>
        </form>

        <script src="{{ url_for('static', filename='gsap/gsap.min.js') }}"></script>

        <script>
            function del_task(id){
                fetch("/api/process", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ type: "delete", task_id: id })
                })
                .then(response => {
                    if (!response.ok){
                        throw new Error("network error!");
                    }

                    return response.json();
                })
                .then(data => {
                    if (data.success){
                        window.location.reload();
                    }
                })
                .catch(e => {
                    console.log(`Error: ${e}`)
                })
            }
        </script>

        <script>
            function openclose_modal(open){
                const modal = document.querySelector(".task_modal");
                if (open){
                    modal.classList.add("active");
                } else {
                    modal.classList.remove("active");
                }
            }

            // Close modal when clicking outside
            document.addEventListener("click", (e) => {
                const modal = document.querySelector(".task_modal");
                if (modal && !modal.contains(e.target) && !e.target.closest("button")){
                    openclose_modal(false);
                }
            });

            // Handle form submission
            document.querySelector(".task_modal").addEventListener("submit", (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const data = Object.fromEntries(formData);
                
                fetch("/home", {
                    method: "POST",
                    body: new URLSearchParams(data)
                })
                .then(() => {
                    window.location.reload();
                })
                .catch(err => console.log(`Error: ${err}`));
            });
        </script>
    </body>
</html>
